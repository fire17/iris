<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="iris — the wordmark beside an open eight-bladed camera aperture on a near-black field. Subtitle: no backend of ours — the whole app runs in your tab. Receipts: no backend of ours, torrents in the tab, Whisper in-browser, static pages.">
<title>iris — no backend of ours — the whole app runs in your tab</title>
<desc>An eight-bladed camera iris, held open, ringed with aperture-scale ticks, sits to the left of the serif wordmark "iris" on a near-black gradient field. Hot pink rules mark the type block, which closes with a line of receipts: NO BACKEND OF OURS, TORRENTS IN THE TAB, WHISPER IN-BROWSER, STATIC PAGES.</desc>
