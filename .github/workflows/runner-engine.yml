# runner-engine — a self-regulating pool of hosted in-memory torrent-engine runners.
#
# EXPERIMENTAL / AT-OWN-RISK. Serving media from GitHub Actions runners VIOLATES GitHub's
# Acceptable Use Policy (Actions is CI/CD, not a media/streaming service). Repeated pool
# runs can get the repo or account flagged and Actions disabled. This workflow is kept
# OPT-IN (the browser only uses it behind hp.torrent.runnerEngine=1), low-footprint
# (POOL=2), rate-limited (the engine token-buckets new torrent adds), in-memory (no data
# at rest), and short-lived. It is a knowing tradeoff, not a solved problem. See
# server/RUNNER.md. Do NOT enable this on a repo/account you are not willing to risk.
#
# Liveness by REDUNDANCY (relay-baton pattern): each run lives ~55 min; an admission gate
# keeps ~POOL runs alive at once, staggered ~STAGGER apart, so a fresh runner overlaps the
# old one and the discovery floor always has a live URL to announce. cron fires often;
# the gate turns noisy cron into a smooth bounded pool. Tokenless: the gate uses only the
# read-only GITHUB_TOKEN (actions:read) to count live runs — no PAT, nothing at rest.
on:
  workflow_dispatch:
    inputs:
      # Empty room = derived per-repo by runner.mjs from GITHUB_REPOSITORY (a plain env
      # var, no token): forks get their own floor room with ZERO configuration, and the
      # official repo keeps the legacy iris-hp-runner-v1 name.
      room:  { description: 'floor room (empty = derived from this repo)', default: '' }
      force: { description: bypass the pool gate (always run), default: 'false' }
  # 24/7 always-warm pool: cron admits through the gate below, which keeps ~POOL runners
  # overlapping so the discovery floor always has a live URL (no "no runner" gaps).
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read

env:
  POOL: '2'         # target overlapping live runs (lower than baton's 3 — ToS-conservative)
  STAGGER: '9600'   # seconds; admit a replacement once the youngest run is this old (≈ RUN_SECONDS / POOL = 19200/2)

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "forced"; exit 0; fi
          now=$(date -u +%s)
          others=$(gh run list --repo "$REPO" --workflow runner-engine.yml --status in_progress \
                     --json databaseId,createdAt \
                     --jq "[.[] | select(.databaseId != ($SELF|tonumber))]")
          count=$(echo "$others" | jq 'length')
          youngest=$(echo "$others" | jq -r 'sort_by(.createdAt) | last | .createdAt // empty')
          if [ "$count" -lt "$POOL" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "admit: pool has $count/$POOL live — fill it"
          else
            age=$(( now - $(date -u -d "$youngest" +%s) ))
            if [ "$age" -ge "$STAGGER" ]; then
              echo "go=true" >> "$GITHUB_OUTPUT"; echo "admit: pool full ($count) but youngest is ${age}s (>= $STAGGER) — stagger a replacement"
            else
              echo "go=false" >> "$GITHUB_OUTPUT"; echo "skip: pool full ($count), youngest only ${age}s (< $STAGGER)"
            fi
          fi

  # Primes the ffmpeg cache in PARALLEL with the runner (JS deps need no cache — they
  # ship bundled in the repo): the long-lived runner job only saves its cache when it
  # completes 5h20m later, and a cancelled run never does, so this ~30s job makes even a
  # brand-new fork's SECOND run instant. No-op once the cache exists.
  warmcache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/cache@v4
        id: ff
        with:
          path: /tmp/ffbin
          key: ffmpeg-static-amd64-v1
      - if: steps.ff.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/ffbin
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /tmp/ffbin/

  runner:
    needs: admit
    if: ${{ needs.admit.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350   # must exceed RUN_SECONDS (5h20m); GitHub hard-caps a job at 6h
    steps:
      - uses: actions/checkout@v4

      # FIRST-RUN-EVER SPEED (fire17: "pre-prepared even before cache; after first
      # contact run EVERYTHING CONCURRENTLY"):
      #   - the committed server/*.bundle.mjs carry ALL JS deps — zero npm install, even
      #     on a brand-new fork's very first run (proven by booting with no node_modules)
      #   - no setup-node: the runner image ships node >= 20 (engine needs >= 18)
      #   - the hold step below starts cloudflared + ffmpeg installs in the BACKGROUND
      #     while the bundled engine is already booting; runner.mjs waits for cloudflared
      #     only at the moment it opens the tunnel, and ffmpeg only at the first
      #     transcode (/status reports ffmpeg:false so the site shows "warming")
      #   - the ffmpeg static build is cached per-repo (tokenless) for later runs
      - uses: actions/cache@v4
        with:
          path: /tmp/ffbin
          key: ffmpeg-static-amd64-v1

      - name: hold the runner (in memory only)
        env:
          HP_ROOM:      '${{ inputs.room || '''' }}'
          HP_INMEM:     '1'
          RUN_SECONDS:  '19200'   # 5h20m per run (long-lived pool members → fewer handoffs)
          HANDOFF_AT:   '19080'   # stop announcing ~2 min before close
          HP_MAX_BYTES: '4294967296'   # 4 GiB per-file cap (ubuntu-latest ~16 GiB RAM)
          HP_MAX_TORRENTS: '2'
        run: |
          # EVERYTHING CONCURRENT after first contact: both installs background while the
          # bundled engine boots and announces (runner.mjs gates the tunnel on cloudflared
          # appearing, the first transcode on ffmpeg appearing — nothing serializes).
          ( curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared \
              && sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared \
              && echo "[warm] cloudflared ready" ) &
          (
            if [ -x /tmp/ffbin/ffmpeg ] && [ -x /tmp/ffbin/ffprobe ]; then
              sudo cp /tmp/ffbin/ffmpeg /tmp/ffbin/ffprobe /usr/local/bin/
              echo "[warm] ffmpeg from cache"
            else
              mkdir -p /tmp/ffbin
              ( curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz \
                  && tar -xJf /tmp/ff.tar.xz -C /tmp \
                  && cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /tmp/ffbin/ \
                  && sudo cp /tmp/ffbin/ffmpeg /tmp/ffbin/ffprobe /usr/local/bin/ \
                  && echo "[warm] ffmpeg static installed (and cached for next run)" ) \
                || ( sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && echo "[warm] ffmpeg via apt" )
            fi
          ) &
          # insurance only — the committed bundle is the normal path, npm never runs
          [ -f server/runner.bundle.mjs ] || ( cd server && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund) )
          node server/runner.bundle.mjs || node server/runner.mjs
